image sdcard.img {
  hdimage {
  }

  partition boot {
    partition-type = 0x0C
    bootable = "true"
    image = "boot.vfat"
  }

  partition rootfs {
    partition-type = 0x83
    image = "rootfs.ext4"
  }
}

image boot.vfat {
  vfat {
    files = {
      "bcm2708-rpi-zero.dtb",
      "bcm2708-rpi-zero-w.dtb",
      "bootcode.bin",
      "cmdline.txt",
      "config.txt",
      "fixup.dat",
      "overlays",
      "start.elf",
      "zImage"
    }
  }
  size = 64M
}
