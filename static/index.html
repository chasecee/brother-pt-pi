<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Label Buddy</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/style.css" />
    <script src="/static/js/opentype.min.js"></script>
    <script src="/static/js/render.js"></script>
  </head>
  <body>
    <h1>
      Label printer <span id="status" class="bad">checking...</span>
      <span id="mem" class="mem" hidden></span>
      <a
        class="meta-link"
        href="https://github.com/chasecee/brother-pt-pi/actions"
        target="_blank"
        rel="noopener"
        >Actions</a
      >
      <button id="wakeBtn" type="button" class="btn btn-sm" hidden>Wake</button>
    </h1>

    <div id="draftEditor" class="draft-editor"></div>
    <button type="button" id="addLineBtn" class="btn btn-sm">Add line</button>

    <div class="settings">
      <details class="font-accordion" id="fontAccordion">
        <summary class="font-accordion-summary">
          <span>Font</span>
          <span id="fontAccordionHint" class="font-accordion-hint"></span>
        </summary>
        <div class="font-accordion-body">
          <div class="row font-picker-row">
            <div class="font-picker">
              <button
                type="button"
                id="fontCurrent"
                class="font-current"
                aria-expanded="false"
                aria-controls="fontPanel"
              ></button>
              <div id="fontPanel" class="font-panel" hidden>
                <input
                  type="search"
                  id="fontSearch"
                  placeholder="Search fonts"
                  autocomplete="off"
                />
                <div id="fontList" class="font-list"></div>
              </div>
            </div>
            <label><input type="checkbox" id="bold" checked /> Bold</label>
            <label><input type="checkbox" id="italic" /> Italic</label>
          </div>
          <div class="row">
            <label
              >Size <input type="number" id="fontSize" min="10" max="128"
            /></label>
            <label
              >V align <input type="number" id="vAlign" min="-32" max="32"
            /></label>
            <label
              >Spacing
              <input
                type="number"
                id="letterSpacing"
                min="-5"
                max="20"
                step="0.5"
            /></label>
          </div>
        </div>
      </details>
      <details class="font-accordion icon-accordion" id="iconAccordion">
        <summary class="font-accordion-summary icon-accordion-summary">
          <span id="iconQuickPicks" class="icon-quick-picks"></span>
        </summary>
        <div class="font-accordion-body">
          <div id="iconCategoryStrip" class="icon-category-strip"></div>
          <input
            type="search"
            id="iconSearch"
            placeholder="Search icons"
            autocomplete="off"
          />
          <div id="iconGrid" class="icon-grid"></div>
          <label class="icon-upload">
            Upload image
            <input
              type="file"
              id="iconUpload"
              accept="image/png,image/jpeg"
              hidden
            />
          </label>
          <div class="row">
            <label
              >Gap <input type="number" id="iconGap" min="0" max="64"
            /></label>
            <label
              >Size
              <input type="number" id="iconSize" min="0.25" max="2" step="0.05"
            /></label>
          </div>
        </div>
      </details>
      <div class="row">
        <label
          >Margin <input type="number" id="marginH" min="0" max="128"
        /></label>
        <label
          >Qty
          <input
            type="number"
            id="qty"
            class="narrow"
            value="1"
            min="1"
            max="99"
        /></label>
      </div>
    </div>

    <div class="queue-header">
      <h2>Queue (<span id="count">0</span>)</h2>
      <button id="printBtn" class="btn btn-primary">Print all</button>
    </div>

    <div class="queue-table">
      <div class="head">Label preview</div>
      <div class="head">Quantity</div>
      <div class="head"></div>
      <div class="head"></div>
      <div id="queue"></div>
    </div>

    <details id="recentSection" class="recent-section font-accordion" hidden>
      <summary class="font-accordion-summary">
        <span>Recently printed</span>
        <span id="recentHint" class="font-accordion-hint"></span>
      </summary>
      <div class="font-accordion-body">
        <div class="queue-table recent-table">
          <div class="head">Label preview</div>
          <div class="head">Quantity</div>
          <div class="head"></div>
          <div id="recent"></div>
        </div>
      </div>
    </details>

    <script>
      const labels = [];
      const recent = [];
      const $ = (id) => document.getElementById(id);
      const QUEUE_MAX = 50;
      let DEFAULT_PREFS = {};
      let LIMITS = {};
      let tapeMm = 18;
      let baselineTapeHeightPx = 112;
      let fontCatalog = {};
      let syncTimer = null;
      let stateSaveTimer = null;
      let previewSeq = 0;
      let printInFlight = 0;
      let statusTimer = null;
      let mediaTimer = null;
      let usbOk = false;
      let detectedMedia = null;
      let lastAppliedWidth = null;
      let fontObserver = null;
      let iconObserver = null;
      let focusedRowIndex = 0;
      let iconCategories = [];
      let currentIconCategory = "";
      let currentIconList = [];
      let iconSearchTimer = null;
      const DEFAULT_ICON_CATEGORY = "dp-emoji";
      const ICON_QUICK_PICKS = [
        { id: "dp-emoji:57345", title: "Smiley" },
        { id: "dp-emoji:57346", title: "Frowny" },
        { id: "dp-emoji:57344", title: "Party" },
      ];

      function selectedFontFamily() {
        const el = document.querySelector('input[name="fontFamily"]:checked');
        return el ? el.value : DEFAULT_PREFS.fontFamily;
      }

      function effectiveTapeHeightPx() {
        if (detectedMedia && detectedMedia.height_px)
          return detectedMedia.height_px;
        return baselineTapeHeightPx;
      }

      function applyConfigLimits() {
        if (!LIMITS.font_size) return;
        $("fontSize").min = LIMITS.font_size[0];
        $("fontSize").max = LIMITS.font_size[1];
        $("vAlign").min = LIMITS.v_align[0];
        $("vAlign").max = LIMITS.v_align[1];
        $("marginH").min = LIMITS.margin_h[0];
        $("marginH").max = LIMITS.margin_h[1];
        $("iconGap").min = LIMITS.icon_gap[0];
        $("iconGap").max = LIMITS.icon_gap[1];
        $("iconSize").min = LIMITS.icon_size[0];
        $("iconSize").max = LIMITS.icon_size[1];
        $("qty").min = LIMITS.qty[0];
        $("qty").max = LIMITS.qty[1];
      }

      async function loadConfig() {
        const cfg = await (await fetch("/api/config")).json();
        DEFAULT_PREFS = cfg.prefs || {};
        LIMITS = cfg.limits || {};
        tapeMm = cfg.tapeHeightMm || 18;
        baselineTapeHeightPx = 112;
        applyConfigLimits();
        updateTapeScale();
      }

      function updateTapeScale() {
        const scale = window.devicePixelRatio > 1 ? 72 / 96 : 1;
        document.documentElement.style.setProperty(
          "--tape-display-mm",
          String(tapeMm * scale),
        );
      }

      function blocksHaveContent(blocks) {
        if (!Array.isArray(blocks)) return false;
        for (const b of blocks) {
          if (b.type === "text" && String(b.value || "").trim()) return true;
          if (b.type === "icon" && b.id) return true;
        }
        return false;
      }

      function blocksEqual(a, b) {
        return JSON.stringify(a) === JSON.stringify(b);
      }

      function rowBlocks(row) {
        const blocks = [];
        const strip = row.querySelector(".block-strip");
        if (!strip) return blocks;
        for (const el of strip.children) {
          if (el.classList.contains("block-add-wrap")) continue;
          if (el.classList.contains("block-text-wrap")) {
            const input = el.querySelector(".block-text");
            blocks.push({ type: "text", value: input?.value ?? "" });
          } else if (el.classList.contains("icon-chip")) {
            const block = { type: "icon", id: el.dataset.id };
            if (el.dataset.height) block.height = parseFloat(el.dataset.height);
            if (el.classList.contains("icon-chip-image")) {
              if (el.dataset.fit) block.fit = el.dataset.fit;
              if (el.dataset.rotate)
                block.rotate = parseInt(el.dataset.rotate, 10);
            }
            blocks.push(block);
          }
        }
        return blocks;
      }

      function getDraftLines() {
        return [...document.querySelectorAll("#draftEditor .label-row")]
          .map((row) => rowBlocks(row))
          .filter(blocksHaveContent);
      }

      function currentPrefs() {
        return {
          fontFamily: selectedFontFamily(),
          bold: $("bold").checked,
          italic: $("italic").checked,
          fontSize: parseInt($("fontSize").value, 10) || DEFAULT_PREFS.fontSize,
          vAlign: parseInt($("vAlign").value, 10) || 0,
          letterSpacing: parseFloat($("letterSpacing").value) || 0,
          marginH: parseInt($("marginH").value, 10) || DEFAULT_PREFS.marginH,
          iconGap: parseInt($("iconGap").value, 10) || DEFAULT_PREFS.iconGap,
          iconSize: parseFloat($("iconSize").value) || DEFAULT_PREFS.iconSize,
        };
      }

      function updateIconLayoutStyles() {
        const gap = parseInt($("iconGap").value, 10);
        const size = parseFloat($("iconSize").value);
        document.documentElement.style.setProperty(
          "--icon-gap",
          `${Number.isFinite(gap) ? gap : DEFAULT_PREFS.iconGap}px`,
        );
        const scale = Number.isFinite(size) ? size : DEFAULT_PREFS.iconSize;
        document.documentElement.style.setProperty(
          "--icon-chip-size",
          `${Math.round(34 * scale)}px`,
        );
      }

      async function pushServerState(partial) {
        try {
          const resp = await fetch("/api/state", {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(partial),
          });
          if (!resp.ok) {
            const r = await resp.json().catch(() => ({}));
            alert("Save failed: " + (r.err || resp.statusText));
          }
        } catch {
          alert("Save failed");
        }
      }

      function flushStateSave() {
        clearTimeout(stateSaveTimer);
        stateSaveTimer = null;
        fetch("/api/state", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            draft: { lines: getDraftLines() },
            queue: labels.map(itemPayload),
            prefs: currentPrefs(),
          }),
          keepalive: true,
        });
      }

      function scheduleStateSave() {
        clearTimeout(stateSaveTimer);
        stateSaveTimer = setTimeout(() => {
          pushServerState({
            draft: { lines: getDraftLines() },
            queue: labels.map(itemPayload),
            prefs: currentPrefs(),
          });
        }, 500);
      }

      function savePrefs() {
        pushServerState({ prefs: currentPrefs() });
      }

      function saveState() {
        scheduleStateSave();
      }

      async function loadServerState() {
        const r = await (await fetch("/api/state")).json();
        applyPrefs({ ...DEFAULT_PREFS, ...(r.prefs || {}) });
        const draft = r.draft;
        const lines = draft && draft.lines ? draft.lines : [];
        if (!lines.length && typeof draft === "string" && draft.trim()) {
          for (const line of draft.split("\n")) {
            const t = line.trim();
            if (t) lines.push([{ type: "text", value: t }]);
          }
        }
        renderDraftEditor(
          lines.length ? lines : [[{ type: "text", value: "" }]],
        );
        labels.length = 0;
        for (const item of r.queue || []) {
          labels.push({ ...item, png: null });
        }
        recent.length = 0;
        for (const item of r.recent || []) {
          recent.push({ ...item, png: null });
        }
      }

      function applyPreset(preset) {
        if (!preset || preset.width_mm === lastAppliedWidth) return;
        lastAppliedWidth = preset.width_mm;
        $("fontSize").value = preset.font_size;
        $("marginH").value = preset.margin_h;
        $("vAlign").value = preset.v_align;
        $("letterSpacing").value = preset.letter_spacing;
        tapeMm = preset.width_mm;
        updateTapeScale();
        savePrefs();
      }

      function applyMedia(data) {
        if (!data || !data.ok) return;
        detectedMedia = data;
        if (data.width_mm) tapeMm = data.width_mm;
        updateTapeScale();
        applyPreset(data.preset);
      }

      function applyPrefs(prefs) {
        $("fontSize").value = prefs.fontSize;
        $("bold").checked = prefs.bold;
        $("italic").checked = prefs.italic;
        $("vAlign").value = prefs.vAlign;
        $("letterSpacing").value = prefs.letterSpacing;
        $("marginH").value = prefs.marginH;
        $("iconGap").value = prefs.iconGap;
        $("iconSize").value = prefs.iconSize;
        const radio = $("fontList").querySelector(
          `input[name="fontFamily"][value="${CSS.escape(prefs.fontFamily)}"]`,
        );
        if (radio) {
          radio.checked = true;
          radio.closest(".font-row")?.scrollIntoView({ block: "nearest" });
        }
        updateFontCurrent();
        updateStyleToggles();
        updateIconLayoutStyles();
      }

      function updateStyleToggles() {
        const variants = fontCatalog[selectedFontFamily()] || {};
        $("bold").disabled = !variants.bold && !variants.boldItalic;
        $("italic").disabled = !variants.italic && !variants.boldItalic;
        if ($("bold").disabled) $("bold").checked = false;
        if ($("italic").disabled) $("italic").checked = false;
      }

      function renderOpts() {
        return {
          font_size:
            parseInt($("fontSize").value, 10) || DEFAULT_PREFS.fontSize,
          font_family: selectedFontFamily(),
          bold: $("bold").checked,
          italic: $("italic").checked,
          v_align: parseInt($("vAlign").value, 10) || 0,
          letter_spacing: parseFloat($("letterSpacing").value) || 0,
          margin_h: parseInt($("marginH").value, 10) || DEFAULT_PREFS.marginH,
          icon_gap: parseInt($("iconGap").value, 10) || DEFAULT_PREFS.iconGap,
          icon_size: parseFloat($("iconSize").value) || DEFAULT_PREFS.iconSize,
        };
      }

      function defaultQty() {
        return Math.max(
          LIMITS.qty[0],
          Math.min(LIMITS.qty[1], parseInt($("qty").value, 10) || 1),
        );
      }

      function itemPayload(item) {
        return {
          blocks: item.blocks,
          qty: item.qty || 1,
          font_size: item.font_size,
          font_family: item.font_family,
          bold: item.bold,
          italic: item.italic,
          v_align: item.v_align,
          letter_spacing: item.letter_spacing,
          margin_h: item.margin_h,
          icon_gap: item.icon_gap,
          icon_size: item.icon_size,
        };
      }

      function itemOpts(item) {
        return {
          font_size: item.font_size,
          font_family: item.font_family,
          bold: item.bold,
          italic: item.italic,
          v_align: item.v_align,
          letter_spacing: item.letter_spacing,
          margin_h: item.margin_h,
          icon_gap: item.icon_gap,
          icon_size: item.icon_size,
        };
      }

      function optsMatch(a, b) {
        return (
          a.font_size === b.font_size &&
          a.font_family === b.font_family &&
          a.bold === b.bold &&
          a.italic === b.italic &&
          a.v_align === b.v_align &&
          a.letter_spacing === b.letter_spacing &&
          a.margin_h === b.margin_h &&
          a.icon_gap === b.icon_gap &&
          a.icon_size === b.icon_size
        );
      }

      function labelsTotal() {
        return labels.reduce((n, item) => n + (item.qty || 1), 0);
      }

      async function applyRecentFromServer(items) {
        recent.length = 0;
        for (const item of items || []) {
          recent.push({ ...item, png: null });
        }
        renderRecent();
        await Promise.all(recent.filter((item) => !item.png).map(fetchPreview));
        renderRecent();
      }

      function requeueItem(item) {
        const lines = getDraftLines();
        lines.push(item.blocks || []);
        renderDraftEditor(lines);
        scheduleSync();
      }

      function flushSync() {
        clearTimeout(syncTimer);
        syncTimer = null;
        syncFromEditor();
        flushStateSave();
      }

      function removeLabel(index) {
        labels.splice(index, 1);
        const lines = labels.map((item) => item.blocks || []);
        renderDraftEditor(
          lines.length ? lines : [[{ type: "text", value: "" }]],
        );
        saveState();
        renderTable();
      }

      const TRASH_SVG =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>';

      function createRemoveBtn(title, extraClass = "") {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = `block-remove ${extraClass}`.trim();
        btn.title = title;
        btn.innerHTML = TRASH_SVG;
        return btn;
      }

      function iconThumbUrl(iconId) {
        if (iconId.startsWith("custom:"))
          return `/icons/custom/${iconId.slice(7)}`;
        const parts = iconId.split(":");
        if (parts.length === 2)
          return `/icons/thumbs/${parts[0]}/${parts[1]}.png`;
        return "";
      }

      function isCustomIcon(iconId) {
        return iconId.startsWith("custom:");
      }

      function applyIconChipStyle(chip) {
        const frame = chip.querySelector(".icon-chip-frame");
        const img = chip.querySelector(".icon-chip-frame img");
        if (!frame || !img) return;
        if (!isCustomIcon(chip.dataset.id)) {
          delete frame.dataset.fit;
          delete frame.dataset.rotated;
          img.style.transform = "";
          return;
        }
        const fit = chip.dataset.fit || "crop";
        const rot = parseInt(chip.dataset.rotate || "0", 10) || 0;
        frame.dataset.fit = fit;
        if (rot % 180 !== 0) {
          frame.dataset.rotated = "1";
        } else {
          delete frame.dataset.rotated;
        }
        img.style.transform = rot ? `rotate(${rot}deg)` : "";
        chip
          .querySelectorAll(".icon-chip-toolbar button[data-mode]")
          .forEach((btn) => {
            btn.classList.toggle("active", btn.dataset.mode === fit);
          });
      }

      function setIconChipFit(chip, fit) {
        chip.dataset.fit = fit;
        applyIconChipStyle(chip);
        scheduleSync();
      }

      function rotateIconChip(chip) {
        const cur = parseInt(chip.dataset.rotate || "0", 10) || 0;
        chip.dataset.rotate = String((cur + 90) % 360);
        applyIconChipStyle(chip);
        scheduleSync();
      }

      function createIconChip(iconId, thumbUrl, opts = {}) {
        const custom = isCustomIcon(iconId);
        const chip = document.createElement("button");
        chip.type = "button";
        chip.className = custom ? "icon-chip icon-chip-image" : "icon-chip";
        chip.dataset.id = iconId;
        if (opts.height != null && opts.height !== 1)
          chip.dataset.height = String(opts.height);
        if (custom) {
          chip.dataset.fit = opts.fit || "crop";
          if (opts.rotate) chip.dataset.rotate = String(opts.rotate);
        }

        let toolbar = null;
        if (custom) {
          toolbar = document.createElement("div");
          toolbar.className = "icon-chip-toolbar";
          for (const mode of ["fit", "cover", "crop"]) {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.dataset.mode = mode;
            btn.textContent = mode.charAt(0).toUpperCase() + mode.slice(1);
            btn.title = mode.charAt(0).toUpperCase() + mode.slice(1);
            btn.addEventListener("mousedown", (e) => e.preventDefault());
            btn.onclick = (e) => {
              e.stopPropagation();
              setIconChipFit(chip, mode);
            };
            toolbar.append(btn);
          }
          const rotateBtn = document.createElement("button");
          rotateBtn.type = "button";
          rotateBtn.className = "icon-chip-rotate";
          rotateBtn.textContent = "Rotate";
          rotateBtn.title = "Rotate 90°";
          rotateBtn.addEventListener("mousedown", (e) => e.preventDefault());
          rotateBtn.onclick = (e) => {
            e.stopPropagation();
            rotateIconChip(chip);
          };
          toolbar.append(rotateBtn);
        }

        const frame = document.createElement("span");
        frame.className = "icon-chip-frame";
        const img = document.createElement("img");
        img.src = thumbUrl;
        img.alt = "";
        frame.append(img);
        const remove = createRemoveBtn("Remove icon");
        remove.addEventListener("mousedown", (e) => e.preventDefault());
        remove.onclick = (e) => {
          e.stopPropagation();
          chip.remove();
          scheduleSync();
        };
        if (toolbar) {
          chip.append(toolbar, frame, remove);
        } else {
          chip.append(frame, remove);
        }
        applyIconChipStyle(chip);
        chip.onclick = (e) => {
          e.stopPropagation();
          if (
            e.target.closest(".block-remove") ||
            e.target.closest(".icon-chip-toolbar")
          )
            return;
          if (chip.classList.contains("confirming")) {
            chip.classList.remove("confirming");
            return;
          }
          closeAllChipConfirms();
          chip.classList.add("confirming");
        };
        return chip;
      }

      function closeAllChipConfirms() {
        document
          .querySelectorAll(".icon-chip.confirming")
          .forEach((c) => c.classList.remove("confirming"));
      }

      function removeTextWrap(wrap, row) {
        const strip = row.querySelector(".block-strip");
        const segments = [
          ...strip.querySelectorAll(".block-text-wrap, .icon-chip"),
        ];
        if (segments.length > 1 || strip.querySelector(".icon-chip")) {
          wrap.remove();
          scheduleSync();
          return;
        }
        const rows = document.querySelectorAll("#draftEditor .label-row");
        if (rows.length > 1) {
          row.remove();
          scheduleSync();
          return;
        }
        wrap.querySelector(".block-text").value = "";
        scheduleSync();
      }

      function createTextSegment(value) {
        const wrap = document.createElement("div");
        wrap.className = "block-text-wrap";

        const input = document.createElement("input");
        input.type = "text";
        input.className = "block-text";
        input.placeholder = "Text";
        input.value = value || "";
        input.addEventListener("input", scheduleSync);
        input.addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            e.preventDefault();
            addDraftLine();
          }
        });
        input.addEventListener("focus", () => {
          closeAllChipConfirms();
          document.querySelectorAll(".block-text-wrap.focused").forEach((w) => {
            if (w !== wrap) w.classList.remove("focused");
          });
          wrap.classList.add("focused");
        });
        input.addEventListener("blur", () => {
          setTimeout(() => wrap.classList.remove("focused"), 0);
        });

        const remove = createRemoveBtn("Remove text");
        remove.addEventListener("mousedown", (e) => e.preventDefault());
        remove.onclick = (e) => {
          e.stopPropagation();
          removeTextWrap(wrap, wrap.closest(".label-row"));
        };

        wrap.append(input, remove);
        return wrap;
      }

      function closeAllAddMenus() {
        document.querySelectorAll(".block-add-menu").forEach((m) => {
          m.hidden = true;
        });
      }

      function createBlockAddMenu(row) {
        const wrap = document.createElement("div");
        wrap.className = "block-add-wrap";

        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "block-add";
        btn.textContent = "+";
        btn.title = "Add text, icon, or image";

        const menu = document.createElement("div");
        menu.className = "block-add-menu";
        menu.hidden = true;

        const addText = document.createElement("button");
        addText.type = "button";
        addText.textContent = "Text";
        addText.title = "Add a text segment";
        addText.onclick = () => {
          closeAllAddMenus();
          const seg = createTextSegment("");
          insertBlockInRow(row, seg);
          seg.focus();
          scheduleSync();
        };

        const addIcon = document.createElement("button");
        addIcon.type = "button";
        addIcon.textContent = "Icon";
        addIcon.title = "Pick an icon from the library below";
        addIcon.onclick = () => {
          closeAllAddMenus();
          const acc = $("iconAccordion");

        addCustom.type = "button";

          closeAllAddMenus();

        };

      let pendingIconRow = null;

      function insertBlockInStrip(strip, node) {
        const addWrap = strip.querySelector(".block-add-wrap");
        strip.insertBefore(node, addWrap);
      }

      function insertBlockInRow(row, node) {
        const strip = row.querySelector(".block-strip");
        if (strip) insertBlockInStrip(strip, node);
      }

      function createLabelRow(blocks, index) {
        const row = document.createElement("div");
        row.className = "label-row";
        row.dataset.index = String(index);

        const strip = document.createElement("div");
        strip.className = "block-strip";
        strip.append(createBlockAddMenu(row));

        const ordered = blocks?.length ? blocks : [{ type: "text", value: "" }];
        for (const block of ordered) {
          if (block.type === "text") {
            insertBlockInStrip(strip, createTextSegment(block.value));
          } else if (block.type === "icon") {
            insertBlockInStrip(
              strip,
              createIconChip(
                block.id,
                block.thumb_url || iconThumbUrl(block.id),
                { height: block.height, fit: block.fit, rotate: block.rotate },
              ),
            );
          }
        }

        strip.addEventListener("keydown", (e) => {
          if (e.key !== "Backspace") return;
          const active = document.activeElement;
          if (!active?.classList?.contains("block-text") || active.value)
            return;
          const wrap = active.closest(".block-text-wrap");
          if (!wrap) return;
          const segments = [
            ...strip.querySelectorAll(".block-text-wrap, .icon-chip"),
          ];
          if (segments.length > 1 || strip.querySelector(".icon-chip")) {
            e.preventDefault();
            removeTextWrap(wrap, row);
            return;
          }
          const rows = document.querySelectorAll("#draftEditor .label-row");
          if (rows.length > 1) {
            e.preventDefault();
            row.remove();
            scheduleSync();
          }
        });

        const remove = createRemoveBtn("Remove line", "row-remove");
        remove.onclick = () => {
          const rows = document.querySelectorAll("#draftEditor .label-row");
          if (rows.length <= 1) {
            strip
              .querySelectorAll(".block-text-wrap, .icon-chip")
              .forEach((el) => el.remove());
            insertBlockInStrip(strip, createTextSegment(""));
            scheduleSync();
            return;
          }
          row.remove();
          scheduleSync();
        };

        row.append(strip, remove);
        return row;
      }

      function renderDraftEditor(lines) {
        const editor = $("draftEditor");
        editor.innerHTML = "";
        const rows = lines.length ? lines : [[{ type: "text", value: "" }]];
        rows.forEach((blocks, i) => {
          editor.append(createLabelRow(blocks, i));
        });
        focusedRowIndex = Math.min(focusedRowIndex, rows.length - 1);
        const focusRow = editor.querySelectorAll(".label-row")[focusedRowIndex];
        focusRow?.querySelector(".block-text")?.focus();
      }

      function addDraftLine() {
        const lines = getDraftLines();
        lines.push([{ type: "text", value: "" }]);
        focusedRowIndex = lines.length;
        renderDraftEditor(lines);
        const rows = document.querySelectorAll("#draftEditor .label-row");
        rows[rows.length - 1]?.querySelector(".block-text")?.focus();
      }

      function focusedLabelRow() {
        const rows = document.querySelectorAll("#draftEditor .label-row");
        return rows[focusedRowIndex] || rows[rows.length - 1] || null;
      }

      function insertIconIntoRow(iconId, thumbUrl) {
        const row = pendingIconRow || focusedLabelRow();
        pendingIconRow = null;
        if (!row) return;
        insertBlockInRow(row, createIconChip(iconId, thumbUrl));
        scheduleSync();
      }

      function renderIconQuickPicks() {
        const wrap = $("iconQuickPicks");
        wrap.innerHTML = "";
        for (const pick of ICON_QUICK_PICKS) {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "icon-quick-pick";
          btn.title = pick.title;
          const img = document.createElement("img");
          img.alt = pick.title;
          img.src = iconThumbUrl(pick.id);
          btn.append(img);
          btn.onclick = (e) => {
            e.preventDefault();
            e.stopPropagation();
            insertIconIntoRow(pick.id, iconThumbUrl(pick.id));

      function buildFontFaces(families) {
        const lines = [];
        for (const fam of families) {
          if (!fam.slug) continue;
          const css = `ptp-${fam.slug}`;
          lines.push(
            `@font-face{font-family:"${css}";src:url("/font-previews/${fam.slug}.woff2") format("woff2");font-display:block}`,
          );
          lines.push(
            `.font-row[data-slug="${fam.slug}"].preview-loaded,.font-current[data-slug="${fam.slug}"].preview-loaded{font-family:"${css}",system-ui,sans-serif}`,
          );
        }
        let el = document.getElementById("fontFaces");
        if (!el) {
          el = document.createElement("style");
          el.id = "fontFaces";
          document.head.append(el);
        }
        el.textContent = lines.join("\n");
      }

      function setupFontObserver(list) {
        if (fontObserver) fontObserver.disconnect();
        fontObserver = new IntersectionObserver(
          (entries) => {
            for (const entry of entries) {
              if (!entry.isIntersecting) continue;
              const row = entry.target;
              if (row.dataset.slug) row.classList.add("preview-loaded");
              fontObserver.unobserve(row);
            }
          },
          { root: list, rootMargin: "40px" },
        );
        for (const row of list.querySelectorAll(".font-row[data-slug]")) {
          fontObserver.observe(row);
        }
      }

      function setFontPanelOpen(open) {
        const panel = $("fontPanel");
        const btn = $("fontCurrent");
        panel.hidden = !open;
        btn.setAttribute("aria-expanded", String(open));
        btn.classList.toggle("open", open);
        if (open) {
          setupFontObserver($("fontList"));
          $("fontSearch").focus();
        }
      }

      function updateFontCurrent() {
        const btn = $("fontCurrent");
        const family = selectedFontFamily();
        const row = $("fontList")
          .querySelector(
            `input[name="fontFamily"][value="${CSS.escape(family)}"]`,
          )
          ?.closest(".font-row");
        btn.textContent = family;
        $("fontAccordionHint").textContent = family;
        if (row?.dataset.slug) {
          btn.dataset.slug = row.dataset.slug;
          btn.classList.add("preview-loaded");
          row.classList.add("preview-loaded");
        } else {
          btn.removeAttribute("data-slug");
          btn.classList.remove("preview-loaded");
        }
      }

      function filterFonts() {
        const q = $("fontSearch").value.trim().toLowerCase();
        for (const row of $("fontList").querySelectorAll(".font-row")) {
          const name = (row.dataset.family || "").toLowerCase();
          row.hidden = !!(q && !name.includes(q));

      async function loadFonts() {
        const r = await (await fetch("/api/fonts")).json();
        const list = $("fontList");
        list.innerHTML = "";
        fontCatalog = {};
        const families = r.families || [];
        PtRender.setFontFamilies(families);
        for (const fam of families) {
          fontCatalog[fam.name] = fam.variants || {};
          const label = document.createElement("label");

          radio.type = "radio";
          radio.name = "fontFamily";
          radio.value = fam.name;
          label.append(radio, document.createTextNode(fam.name));
          list.append(label);
        }
        buildFontFaces(families);
        setupFontObserver(list);
        list.addEventListener("change", (e) => {

          updateFontCurrent();
          setFontPanelOpen(false);

      function setStatus(text, cls) {
        const el = $("status");
        const wakeBtn = $("wakeBtn");
        el.textContent = text;
        el.className = cls;
        wakeBtn.hidden = cls === "ok" || cls === "printing";
      }

      function updateMemDisplay(mem) {
        const el = $("mem");
        if (!mem || mem.avail_mb == null || mem.total_mb == null) {
          el.hidden = true;
          return;
        }
        el.hidden = false;
        el.textContent = mem.avail_mb + " / " + mem.total_mb + " MB free";
        el.className = mem.avail_mb < 64 ? "mem low" : "mem";
      }

      function updateStatusDisplay() {
        if (printInFlight > 0) {
          setStatus("printing", "printing");
          return;
        }
        if (!usbOk) {
          setStatus("not found", "bad");
          return;
        }
        if (detectedMedia && detectedMedia.width_mm) {
          let text = detectedMedia.width_mm + " mm";
          if (
            detectedMedia.errors &&
            detectedMedia.errors.includes("no_media")
          ) {
            text += " · no media";
          } else if (detectedMedia.tape_color && detectedMedia.text_color) {
            text +=
              " · " + detectedMedia.tape_color + "/" + detectedMedia.text_color;
          }
          setStatus(text, "ok");
          return;
        }
        setStatus("ready", "ok");
      }

      async function wakePrinter() {
        const wakeBtn = $("wakeBtn");
        wakeBtn.disabled = true;
        setStatus("waking...", "printing");
        try {
          const r = await (await fetch("/api/wake", { method: "POST" })).json();
          if (!r.ok) {
            alert("Wake failed: " + (r.err || "unknown"));
            return;
          }
          usbOk = true;
          applyMedia(r.media);
        } catch {
          alert("Wake failed");
        } finally {
          wakeBtn.disabled = false;
          await refreshStatus();
          updateStatusDisplay();
        }
      }

      async function refreshStatus() {
        try {
          const r = await (await fetch("/api/status")).json();
          usbOk = !!r.ok;
          updateMemDisplay(r.mem);
          if (r.printing || printInFlight > 0) {
            updateStatusDisplay();
            return;
          }
          updateStatusDisplay();
        } catch {
          usbOk = false;
          setStatus("error", "bad");
          updateMemDisplay(null);
        }
      }

      async function refreshMedia() {
        if (printInFlight > 0) return;
        try {
          const resp = await fetch("/api/media");
          if (resp.status === 409) return;
          const r = await resp.json();
          if (r.ok) {
            applyMedia(r);
          }
          updateStatusDisplay();
        } catch {
          updateStatusDisplay();
        }
      }

      function startStatusPolling() {
        if (statusTimer) return;
        statusTimer = setInterval(
          refreshStatus,
          printInFlight > 0 ? 2000 : 30000,
        );
      }

      function stopStatusPolling() {
        if (statusTimer) {
          clearInterval(statusTimer);
          statusTimer = null;
        }
      }

      function startMediaPolling() {
        if (mediaTimer) return;
        mediaTimer = setInterval(refreshMedia, 60000);
      }

      function stopMediaPolling() {
        if (mediaTimer) {
          clearInterval(mediaTimer);
          mediaTimer = null;
        }
      }

      function resetStatusPolling() {
        stopStatusPolling();
        startStatusPolling();
      }

      async function previewBlocks(blocks, opts, forPrint = false) {
        try {
          return await PtRender.renderLabel(
            blocks,
            opts,
            effectiveTapeHeightPx(),
            { forPrint },
          );
        } catch {
          return null;
        }
      }

      async function fetchPreview(item) {
        item.png = await previewBlocks(item.blocks, itemOpts(item));
        return item.png;
      }

      function scheduleSync() {
        saveState();
        clearTimeout(syncTimer);
        syncTimer = setTimeout(syncFromEditor, 500);
      }

      async function syncFromEditor() {
        const lines = getDraftLines();
        const opts = renderOpts();
        const qtyDefault = defaultQty();
        const next = lines.map((blocks, i) => {
          const prev = labels[i];
          if (
            prev &&
            blocksEqual(prev.blocks, blocks) &&
            optsMatch(prev, opts)
          ) {
            return prev;
          }
          return {
            blocks,
            qty: prev?.qty ?? qtyDefault,
            png: null,
            ...opts,
          };
        });

        labels.length = 0;
        labels.push(...next.slice(-QUEUE_MAX));

        const seq = ++previewSeq;
        await Promise.all(labels.filter((item) => !item.png).map(fetchPreview));
        if (seq !== previewSeq) return;

        saveState();
        renderTable();
      }

      async function refreshAllPreviews() {
        const opts = renderOpts();
        for (const item of labels) {
          Object.assign(item, opts);
          item.png = null;
        }
        const seq = ++previewSeq;
        await Promise.all(labels.map(fetchPreview));
        if (seq !== previewSeq) return;
        saveState();
        renderTable();
      }

      async function printPayload(item) {
        const opts = itemOpts(item);
        const png = await previewBlocks(item.blocks, opts, true);
        if (!png) throw new Error("render failed");
        return { png, qty: item.qty || 1, meta: itemPayload(item) };
      }

      async function printItems(items, { clearOnSuccess = false } = {}) {
        if (items.length === 0) return false;
        printInFlight++;
        updateStatusDisplay();
        resetStatusPolling();
        try {
          let labelsPayload;
          try {
            labelsPayload = await Promise.all(items.map(printPayload));
          } catch (e) {
            alert("Print failed: " + e.message);
            return false;
          }
          const r = await (
            await fetch("/api/print", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ labels: labelsPayload }),
            })
          ).json();
          if (!r.ok) {
            alert("Print failed: " + r.err);
            return false;
          }
          await applyRecentFromServer(r.recent);
          if (clearOnSuccess) {
            labels.length = 0;
            renderDraftEditor([[{ type: "text", value: "" }]]);
            await pushServerState({ draft: { lines: [] }, queue: [] });
            renderTable();
          }
          return true;
        } finally {
          printInFlight--;
          resetStatusPolling();
          refreshStatus();
          refreshMedia();
        }
      }

      function renderTable() {
        $("count").textContent = labelsTotal();
        const container = $("queue");
        container.innerHTML = "";
        labels.forEach((item, i) => {
          const row = document.createElement("div");
          row.className = "queue-row";

          qty.value = item.qty || 1;
          qty.onchange = () => {
            item.qty = Math.max(
              LIMITS.qty[0],
              Math.min(LIMITS.qty[1], parseInt(qty.value, 10) || 1),

            qty.value = item.qty;
            saveState();
            renderTable();
          };

          const printOne = document.createElement("button");
          printOne.className = "btn btn-sm";
          printOne.textContent = "Print";
          printOne.onclick = async () => {
            printOne.disabled = true;

      const ICON_UPLOAD_MAX_DIM = 512;

      async function prepareUploadFile(file) {
        const type = (file.type || "").toLowerCase();
        const name = file.name.toLowerCase();
        const isPng = type === "image/png" || name.endsWith(".png");
        const isJpeg = type === "image/jpeg" || /\.jpe?g$/.test(name);
        if (!isPng && !isJpeg) return null;

        const url = URL.createObjectURL(file);
        try {
          const img = await new Promise((resolve, reject) => {
            const el = new Image();
            el.onload = () => resolve(el);
            el.onerror = () => reject(new Error("invalid image"));
            el.src = url;
          });
          let w = img.naturalWidth;
          let h = img.naturalHeight;
          if (isPng && Math.max(w, h) <= ICON_UPLOAD_MAX_DIM) return file;
          if (Math.max(w, h) > ICON_UPLOAD_MAX_DIM) {
            if (w >= h) {
              h = Math.round((h * ICON_UPLOAD_MAX_DIM) / w);
              w = ICON_UPLOAD_MAX_DIM;
            } else {
              w = Math.round((w * ICON_UPLOAD_MAX_DIM) / h);
              h = ICON_UPLOAD_MAX_DIM;
            }
          }
          const canvas = document.createElement("canvas");
          canvas.width = w;
          canvas.height = h;
          canvas.getContext("2d").drawImage(img, 0, 0, w, h);
          const blob = await new Promise((resolve, reject) => {
            canvas.toBlob(
              (b) => (b ? resolve(b) : reject(new Error("conversion failed"))),
              "image/png",
            );
          });
          const base = file.name.replace(/\.[^.]+$/, "") || "upload";
          return new File([blob], `${base}.png`, { type: "image/png" });
        } finally {
          URL.revokeObjectURL(url);
        }
      }

      $("iconUpload").addEventListener("change", async () => {
        const raw = $("iconUpload").files?.[0];
        if (!raw) return;
        let file;
        try {
          file = await prepareUploadFile(raw);
        } catch {
          alert("Could not read image");
          $("iconUpload").value = "";
          pendingIconRow = null;
          return;
        }
        if (!file) {
          alert("PNG or JPEG only");
          $("iconUpload").value = "";
          pendingIconRow = null;
          return;
        }
        const fd = new FormData();
        fd.append("file", file);
        try {
          const r = await (
            await fetch("/api/icons/custom", { method: "POST", body: fd })
          ).json();
          if (!r.ok) {
            alert("Upload failed: " + (r.err || "unknown"));
            return;
          }
          insertIconIntoRow(r.id, r.thumb_url);
        } catch {
          alert("Upload failed");
        } finally {
          $("iconUpload").value = "";
          pendingIconRow = null;
        }
      });

      document.addEventListener("click", () => {
        closeAllAddMenus();
        closeAllChipConfirms();
      });

      loadConfig()
        .then(() => loadFonts())
        .then(async () => {
          await PtRender.loadIconCatalog();
          renderIconQuickPicks();
          await loadIconCategories();
          await loadServerState();
          renderRecent();
          if (getDraftLines().length !== labels.length) {
            await syncFromEditor();
          } else {
            renderTable();
            await Promise.all(labels.map(fetchPreview));
            renderTable();
          }
          await Promise.all(
            recent.filter((item) => !item.png).map(fetchPreview),
          );
          renderRecent();
        });
    </script>
  </body>
</html>
