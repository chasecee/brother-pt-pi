[package]
name = "ptlabel-bridge"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ptlabel-bridge"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.7"
base64 = "0.22"
chain-print = { path = "../chain-print" }
clap = { version = "4", features = ["derive", "env"] }
mdns-sd = "0.20"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
