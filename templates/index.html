<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ptlabel</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>:root { --tape-display-mm: {{ tape_height_mm }}; }</style>
</head>
<body>
  <h1>Label printer <span id="status" class="bad">checking...</span> <button id="wakeBtn" type="button" class="btn btn-sm" hidden>Wake</button></h1>

  <textarea id="text" placeholder="One label per line"></textarea>

  <div class="settings">
    <details class="font-accordion" id="fontAccordion">
      <summary class="font-accordion-summary">
        <span>Font</span>
        <span id="fontAccordionHint" class="font-accordion-hint"></span>
      </summary>
      <div class="font-accordion-body">
        <div class="row font-picker-row">
          <div class="font-picker">
            <button type="button" id="fontCurrent" class="font-current" aria-expanded="false" aria-controls="fontPanel"></button>
            <div id="fontPanel" class="font-panel" hidden>
              <input type="search" id="fontSearch" placeholder="Search fonts" autocomplete="off">
              <div id="fontList" class="font-list"></div>
            </div>
          </div>
          <label><input type="checkbox" id="bold" checked> Bold</label>
          <label><input type="checkbox" id="italic"> Italic</label>
        </div>
        <div class="row">
          <label>Size <input type="number" id="fontSize" value="{{ prefs.fontSize }}" min="{{ limits.font_size[0] }}" max="{{ limits.font_size[1] }}"></label>
          <label>V align <input type="number" id="vAlign" value="{{ prefs.vAlign }}" min="{{ limits.v_align[0] }}" max="{{ limits.v_align[1] }}"></label>
          <label>Spacing <input type="number" id="letterSpacing" value="{{ prefs.letterSpacing }}" min="-5" max="20" step="0.5"></label>
        </div>
      </div>
    </details>
    <div class="row">
      <label>Margin <input type="number" id="marginH" value="{{ prefs.marginH }}" min="{{ limits.margin_h[0] }}" max="{{ limits.margin_h[1] }}"></label>
      <label>Qty <input type="number" id="qty" class="narrow" value="1" min="{{ limits.qty[0] }}" max="{{ limits.qty[1] }}"></label>
    </div>
  </div>

  <div class="queue-header">
    <h2>Queue (<span id="count">0</span>)</h2>
    <button id="printBtn" class="btn btn-primary">Print all</button>
  </div>

  <div class="queue-table">
    <div class="head">Label preview</div>
    <div class="head">Quantity</div>
    <div class="head"></div>
    <div class="head"></div>
    <div id="queue"></div>
  </div>

  <div id="recentSection" class="recent-section" hidden>
    <div class="queue-header">
      <h2>Recently printed</h2>
    </div>
    <div class="queue-table recent-table">
      <div class="head">Label preview</div>
      <div class="head">Quantity</div>
      <div class="head"></div>
      <div id="recent"></div>
    </div>
  </div>

  <script>
    const labels = [];
    const recent = [];
    const $ = (id) => document.getElementById(id);
    const QUEUE_MAX = 50;
    const DEFAULT_PREFS = {{ prefs | tojson }};
    const LIMITS = {{ limits | tojson }};
    let tapeMm = {{ tape_height_mm }};
    let fontCatalog = {};
    let syncTimer = null;
    let stateSaveTimer = null;
    let previewSeq = 0;
    let printInFlight = 0;
    let statusTimer = null;
    let mediaTimer = null;
    let usbOk = false;
    let detectedMedia = null;
    let lastAppliedWidth = null;
    let fontObserver = null;

    function selectedFontFamily() {
      const el = document.querySelector('input[name="fontFamily"]:checked');
      return el ? el.value : DEFAULT_PREFS.fontFamily;
    }

    function updateTapeScale() {
      const scale = window.devicePixelRatio > 1 ? 72 / 96 : 1;
      document.documentElement.style.setProperty("--tape-display-mm", String(tapeMm * scale));
    }

    function labelLines(text) {
      return text.split("\n").map((s) => s.trim()).filter(Boolean);
    }

    function currentPrefs() {
      return {
        fontFamily: selectedFontFamily(),
        bold: $("bold").checked,
        italic: $("italic").checked,
        fontSize: parseInt($("fontSize").value, 10) || DEFAULT_PREFS.fontSize,
        vAlign: parseInt($("vAlign").value, 10) || 0,
        letterSpacing: parseFloat($("letterSpacing").value) || 0,
        marginH: parseInt($("marginH").value, 10) || DEFAULT_PREFS.marginH
      };
    }

    async function pushServerState(partial) {
      try {
        const resp = await fetch("/api/state", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(partial)
        });
        if (!resp.ok) {
          const r = await resp.json().catch(() => ({}));
          alert("Save failed: " + (r.err || resp.statusText));
        }
      } catch {
        alert("Save failed");
      }
    }

    function flushStateSave() {
      clearTimeout(stateSaveTimer);
      stateSaveTimer = null;
      fetch("/api/state", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          draft: $("text").value,
          queue: labels.map(itemPayload),
          prefs: currentPrefs()
        }),
        keepalive: true
      });
    }

    function scheduleStateSave() {
      clearTimeout(stateSaveTimer);
      stateSaveTimer = setTimeout(() => {
        pushServerState({
          draft: $("text").value,
          queue: labels.map(itemPayload),
          prefs: currentPrefs()
        });
      }, 500);
    }

    function savePrefs() {
      pushServerState({ prefs: currentPrefs() });
    }

    function saveState() {
      scheduleStateSave();
    }

    async function loadServerState() {
      const r = await (await fetch("/api/state")).json();
      applyPrefs({ ...DEFAULT_PREFS, ...(r.prefs || {}) });
      $("text").value = r.draft || "";
      labels.length = 0;
      for (const item of r.queue || []) {
        labels.push({ ...item, png: null });
      }
      recent.length = 0;
      for (const item of r.recent || []) {
        recent.push({ ...item, png: null });
      }
    }

    function applyPreset(preset) {
      if (!preset || preset.width_mm === lastAppliedWidth) return;
      lastAppliedWidth = preset.width_mm;
      $("fontSize").value = preset.font_size;
      $("marginH").value = preset.margin_h;
      $("vAlign").value = preset.v_align;
      tapeMm = preset.width_mm;
      updateTapeScale();
      savePrefs();
    }

    function applyMedia(data) {
      if (!data || !data.ok) return;
      detectedMedia = data;
      if (data.width_mm) tapeMm = data.width_mm;
      updateTapeScale();
      applyPreset(data.preset);
    }

    function applyPrefs(prefs) {
      $("fontSize").value = prefs.fontSize;
      $("bold").checked = prefs.bold;
      $("italic").checked = prefs.italic;
      $("vAlign").value = prefs.vAlign;
      $("letterSpacing").value = prefs.letterSpacing;
      $("marginH").value = prefs.marginH;
      const radio = $("fontList").querySelector(
        `input[name="fontFamily"][value="${CSS.escape(prefs.fontFamily)}"]`
      );
      if (radio) {
        radio.checked = true;
        radio.closest(".font-row")?.scrollIntoView({ block: "nearest" });
      }
      updateFontCurrent();
      updateStyleToggles();
    }

    function updateStyleToggles() {
      const variants = fontCatalog[selectedFontFamily()] || {};
      $("bold").disabled = !variants.bold && !variants.boldItalic;
      $("italic").disabled = !variants.italic && !variants.boldItalic;
      if ($("bold").disabled) $("bold").checked = false;
      if ($("italic").disabled) $("italic").checked = false;
    }

    function renderOpts() {
      return {
        font_size: parseInt($("fontSize").value, 10) || DEFAULT_PREFS.fontSize,
        font_family: selectedFontFamily(),
        bold: $("bold").checked,
        italic: $("italic").checked,
        v_align: parseInt($("vAlign").value, 10) || 0,
        letter_spacing: parseFloat($("letterSpacing").value) || 0,
        margin_h: parseInt($("marginH").value, 10) || DEFAULT_PREFS.marginH
      };
    }

    function defaultQty() {
      return Math.max(LIMITS.qty[0], Math.min(LIMITS.qty[1], parseInt($("qty").value, 10) || 1));
    }

    function itemPayload(item) {
      return {
        text: item.text,
        qty: item.qty || 1,
        font_size: item.font_size,
        font_family: item.font_family,
        bold: item.bold,
        italic: item.italic,
        v_align: item.v_align,
        letter_spacing: item.letter_spacing,
        margin_h: item.margin_h
      };
    }

    function itemOpts(item) {
      return {
        font_size: item.font_size,
        font_family: item.font_family,
        bold: item.bold,
        italic: item.italic,
        v_align: item.v_align,
        letter_spacing: item.letter_spacing,
        margin_h: item.margin_h
      };
    }

    function optsMatch(a, b) {
      return a.font_size === b.font_size
        && a.font_family === b.font_family
        && a.bold === b.bold
        && a.italic === b.italic
        && a.v_align === b.v_align
        && a.letter_spacing === b.letter_spacing
        && a.margin_h === b.margin_h;
    }

    function labelsTotal() {
      return labels.reduce((n, item) => n + (item.qty || 1), 0);
    }

    async function applyRecentFromServer(items) {
      recent.length = 0;
      for (const item of items || []) {
        recent.push({ ...item, png: null });
      }
      renderRecent();
      await Promise.all(recent.filter((item) => !item.png).map(fetchPreview));
      renderRecent();
    }

    function requeueItem(item) {
      const line = item.text;
      const draft = $("text").value.trim();
      $("text").value = draft ? draft + "\n" + line : line;
      scheduleSync();
    }

    function flushSync() {
      clearTimeout(syncTimer);
      syncTimer = null;
      const lines = labelLines($("text").value);
      const opts = renderOpts();
      const qtyDefault = defaultQty();
      const next = lines.map((text, i) => {
        const prev = labels[i];
        if (prev && prev.text === text && optsMatch(prev, opts)) return prev;
        return { text, qty: prev?.qty ?? qtyDefault, png: null, ...opts };
      });
      labels.length = 0;
      labels.push(...next.slice(-QUEUE_MAX));
      flushStateSave();
    }

    function setTextareaFromLabels() {
      $("text").value = labels.map((item) => item.text).join("\n");
    }

    function removeLabel(index) {
      labels.splice(index, 1);
      setTextareaFromLabels();
      saveState();
      renderTable();
    }

    function buildFontFaces(families) {
      const lines = [];
      for (const fam of families) {
        if (!fam.slug) continue;
        const css = `ptp-${fam.slug}`;
        lines.push(
          `@font-face{font-family:"${css}";src:url("/font-previews/${fam.slug}.woff2") format("woff2");font-display:block}`
        );
        lines.push(
          `.font-row[data-slug="${fam.slug}"].preview-loaded,.font-current[data-slug="${fam.slug}"].preview-loaded{font-family:"${css}",system-ui,sans-serif}`
        );
      }
      let el = document.getElementById("fontFaces");
      if (!el) {
        el = document.createElement("style");
        el.id = "fontFaces";
        document.head.append(el);
      }
      el.textContent = lines.join("\n");
    }

    function setupFontObserver(list) {
      if (fontObserver) fontObserver.disconnect();
      fontObserver = new IntersectionObserver((entries) => {
        for (const entry of entries) {
          if (!entry.isIntersecting) continue;
          const row = entry.target;
          if (row.dataset.slug) row.classList.add("preview-loaded");
          fontObserver.unobserve(row);
        }
      }, { root: list, rootMargin: "40px" });
      for (const row of list.querySelectorAll(".font-row[data-slug]")) {
        fontObserver.observe(row);
      }
    }

    function setFontPanelOpen(open) {
      const panel = $("fontPanel");
      const btn = $("fontCurrent");
      panel.hidden = !open;
      btn.setAttribute("aria-expanded", String(open));
      btn.classList.toggle("open", open);
      if (open) {
        setupFontObserver($("fontList"));
        $("fontSearch").focus();
      }
    }

    function updateFontCurrent() {
      const btn = $("fontCurrent");
      const family = selectedFontFamily();
      const row = $("fontList").querySelector(
        `input[name="fontFamily"][value="${CSS.escape(family)}"]`
      )?.closest(".font-row");
      btn.textContent = family;
      $("fontAccordionHint").textContent = family;
      if (row?.dataset.slug) {
        btn.dataset.slug = row.dataset.slug;
        btn.classList.add("preview-loaded");
        row.classList.add("preview-loaded");
      } else {
        btn.removeAttribute("data-slug");
        btn.classList.remove("preview-loaded");
      }
    }

    function filterFonts() {
      const q = $("fontSearch").value.trim().toLowerCase();
      for (const row of $("fontList").querySelectorAll(".font-row")) {
        const name = (row.dataset.family || "").toLowerCase();
        row.hidden = !!(q && !name.includes(q));
      }
    }

    async function loadFonts() {
      const r = await (await fetch("/api/fonts")).json();
      const list = $("fontList");
      list.innerHTML = "";
      fontCatalog = {};
      const families = r.families || [];
      for (const fam of families) {
        fontCatalog[fam.name] = Object.fromEntries(fam.variants.map((v) => [v, true]));
        const label = document.createElement("label");
        label.className = "font-row";
        label.dataset.family = fam.name;
        if (fam.slug) label.dataset.slug = fam.slug;
        const radio = document.createElement("input");
        radio.type = "radio";
        radio.name = "fontFamily";
        radio.value = fam.name;
        label.append(radio, document.createTextNode(fam.name));
        list.append(label);
      }
      buildFontFaces(families);
      setupFontObserver(list);
      list.addEventListener("change", (e) => {
        if (e.target.name !== "fontFamily") return;
        updateFontCurrent();
        setFontPanelOpen(false);
        onControlChange();
      });
      $("fontSearch").addEventListener("input", filterFonts);
      $("fontCurrent").addEventListener("click", () => setFontPanelOpen($("fontPanel").hidden));
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && !$("fontPanel").hidden) setFontPanelOpen(false);
      });
      applyPrefs({ ...DEFAULT_PREFS });
    }

    function setStatus(text, cls) {
      const el = $("status");
      const wakeBtn = $("wakeBtn");
      el.textContent = text;
      el.className = cls;
      wakeBtn.hidden = cls === "ok" || cls === "printing";
    }

    function updateStatusDisplay() {
      if (printInFlight > 0) {
        setStatus("printing", "printing");
        return;
      }
      if (!usbOk) {
        setStatus("not found", "bad");
        return;
      }
      if (detectedMedia && detectedMedia.width_mm) {
        let text = detectedMedia.width_mm + " mm";
        if (detectedMedia.errors && detectedMedia.errors.includes("no_media")) {
          text += " · no media";
        } else if (detectedMedia.tape_color && detectedMedia.text_color) {
          text += " · " + detectedMedia.tape_color + "/" + detectedMedia.text_color;
        }
        setStatus(text, "ok");
        return;
      }
      setStatus("ready", "ok");
    }

    async function wakePrinter() {
      const wakeBtn = $("wakeBtn");
      wakeBtn.disabled = true;
      setStatus("waking...", "printing");
      try {
        const r = await (await fetch("/api/wake", { method: "POST" })).json();
        if (!r.ok) {
          alert("Wake failed: " + (r.err || "unknown"));
          return;
        }
        usbOk = true;
        applyMedia(r.media);
      } catch {
        alert("Wake failed");
      } finally {
        wakeBtn.disabled = false;
        await refreshStatus();
        updateStatusDisplay();
      }
    }

    async function refreshStatus() {
      try {
        const r = await (await fetch("/api/status")).json();
        usbOk = !!r.ok;
        if (r.printing || printInFlight > 0) {
          updateStatusDisplay();
          return;
        }
        updateStatusDisplay();
      } catch {
        usbOk = false;
        setStatus("error", "bad");
      }
    }

    async function refreshMedia() {
      if (printInFlight > 0) return;
      try {
        const resp = await fetch("/api/media");
        if (resp.status === 409) return;
        const r = await resp.json();
        if (r.ok) {
          applyMedia(r);
        }
        updateStatusDisplay();
      } catch {
        updateStatusDisplay();
      }
    }

    function startStatusPolling() {
      if (statusTimer) return;
      statusTimer = setInterval(refreshStatus, printInFlight > 0 ? 2000 : 30000);
    }

    function stopStatusPolling() {
      if (statusTimer) {
        clearInterval(statusTimer);
        statusTimer = null;
      }
    }

    function startMediaPolling() {
      if (mediaTimer) return;
      mediaTimer = setInterval(refreshMedia, 60000);
    }

    function stopMediaPolling() {
      if (mediaTimer) {
        clearInterval(mediaTimer);
        mediaTimer = null;
      }
    }

    function resetStatusPolling() {
      stopStatusPolling();
      startStatusPolling();
    }

    async function previewText(text, opts) {
      const r = await (await fetch("/api/preview", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text, ...opts })
      })).json();
      if (!r.ok) return null;
      return r.png;
    }

    async function fetchPreview(item) {
      item.png = await previewText(item.text, itemOpts(item));
      return item.png;
    }

    function scheduleSync() {
      saveState();
      clearTimeout(syncTimer);
      syncTimer = setTimeout(syncFromTextarea, 500);
    }

    async function syncFromTextarea() {
      const lines = labelLines($("text").value);
      const opts = renderOpts();
      const qtyDefault = defaultQty();
      const next = lines.map((text, i) => {
        const prev = labels[i];
        if (prev && prev.text === text && optsMatch(prev, opts)) {
          return prev;
        }
        return {
          text,
          qty: prev?.qty ?? qtyDefault,
          png: null,
          ...opts
        };
      });

      labels.length = 0;
      labels.push(...next.slice(-QUEUE_MAX));

      const seq = ++previewSeq;
      await Promise.all(labels.filter((item) => !item.png).map(fetchPreview));
      if (seq !== previewSeq) return;

      saveState();
      renderTable();
    }

    async function refreshAllPreviews() {
      const opts = renderOpts();
      for (const item of labels) {
        Object.assign(item, opts);
        item.png = null;
      }
      const seq = ++previewSeq;
      await Promise.all(labels.map(fetchPreview));
      if (seq !== previewSeq) return;
      saveState();
      renderTable();
    }

    async function printItems(items, { clearOnSuccess = false } = {}) {
      if (items.length === 0) return false;
      printInFlight++;
      updateStatusDisplay();
      resetStatusPolling();
      try {
        const r = await (await fetch("/api/print", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ labels: items.map(itemPayload) })
        })).json();
        if (!r.ok) {
          alert("Print failed: " + r.err);
          return false;
        }
        await applyRecentFromServer(r.recent);
        if (clearOnSuccess) {
          labels.length = 0;
          $("text").value = "";
          await pushServerState({ draft: "", queue: [] });
          renderTable();
        }
        return true;
      } finally {
        printInFlight--;
        resetStatusPolling();
        refreshStatus();
        refreshMedia();
      }
    }

    function renderTable() {
      $("count").textContent = labelsTotal();
      const container = $("queue");
      container.innerHTML = "";
      labels.forEach((item, i) => {
        const row = document.createElement("div");
        row.className = "queue-row";

        const img = document.createElement("img");
        if (item.png) img.src = item.png;
        img.alt = "";

        const qty = document.createElement("input");
        qty.type = "number";
        qty.className = "narrow";
        qty.min = String(LIMITS.qty[0]);
        qty.max = String(LIMITS.qty[1]);
        qty.value = item.qty || 1;
        qty.onchange = () => {
          item.qty = Math.max(LIMITS.qty[0], Math.min(LIMITS.qty[1], parseInt(qty.value, 10) || 1));
          qty.value = item.qty;
          saveState();
          renderTable();
        };

        const printOne = document.createElement("button");
        printOne.className = "btn btn-sm";
        printOne.textContent = "Print";
        printOne.onclick = async () => {
          printOne.disabled = true;
          try {
            await printItems([item]);
          } finally {
            printOne.disabled = false;
          }
        };

        const remove = document.createElement("button");
        remove.className = "btn btn-sm btn-danger";
        remove.textContent = "Remove";
        remove.onclick = () => removeLabel(i);

        row.append(img, qty, printOne, remove);
        container.append(row);
      });
      $("printBtn").disabled = labels.length === 0;
    }

    function renderRecent() {
      const section = $("recentSection");
      const container = $("recent");
      container.innerHTML = "";
      section.hidden = recent.length === 0;
      recent.forEach((item) => {
        const row = document.createElement("div");
        row.className = "recent-row";

        const img = document.createElement("img");
        if (item.png) img.src = item.png;
        img.alt = "";

        const qty = document.createElement("span");
        qty.className = "recent-qty";
        qty.textContent = item.qty || 1;

        const requeue = document.createElement("button");
        requeue.className = "btn btn-sm";
        requeue.textContent = "Add";
        requeue.onclick = () => requeueItem(item);

        row.append(img, qty, requeue);
        container.append(row);
      });
    }

    function onControlChange() {
      savePrefs();
      refreshAllPreviews();
    }

    for (const id of ["fontSize", "bold", "italic", "vAlign", "letterSpacing", "marginH"]) {
      $(id).addEventListener("input", onControlChange);
      $(id).addEventListener("change", onControlChange);
    }
    $("text").addEventListener("input", scheduleSync);

    $("printBtn").onclick = async () => {
      if (labels.length === 0) return;
      $("printBtn").disabled = true;
      try {
        await printItems(labels, { clearOnSuccess: true });
      } finally {
        $("printBtn").disabled = labels.length === 0;
      }
    };

    refreshStatus().then(refreshMedia);
    startStatusPolling();
    startMediaPolling();
    $("wakeBtn").onclick = wakePrinter;
    updateTapeScale();
    window.addEventListener("resize", updateTapeScale);
    window.addEventListener("beforeunload", () => {
      flushSync();
    });

    loadFonts().then(async () => {
      await loadServerState();
      renderRecent();
      const draft = $("text").value;
      if (draft && labelLines(draft).length !== labels.length) {
        await syncFromTextarea();
      } else {
        renderTable();
        await Promise.all(labels.map(fetchPreview));
        renderTable();
      }
      await Promise.all(recent.filter((item) => !item.png).map(fetchPreview));
      renderRecent();
    });
  </script>
</body>
</html>
