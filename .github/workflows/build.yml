name: build

on:
  push:
    branches: [main, rust]
  workflow_dispatch:

env:
  BINARY_ARTIFACT: ptlabel-server-linux-armv6hf

jobs:
  build-server:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: arm-unknown-linux-gnueabihf

      - name: Install ARMv6 cross toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-linux-gnueabihf

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Build ARMv6 binary
        run: |
          export CARGO_TARGET_ARM_UNKNOWN_LINUX_GNUEABIHF_LINKER=arm-linux-gnueabihf-gcc
          export RUSTFLAGS="-C target-cpu=arm1176jzf-s -C target-feature=+v6,+vfp2"
          cargo build --release --target arm-unknown-linux-gnueabihf -p ptlabel-server
          cp target/arm-unknown-linux-gnueabihf/release/ptlabel-server "target/release/${{ env.BINARY_ARTIFACT }}"

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BINARY_ARTIFACT }}
          path: target/release/${{ env.BINARY_ARTIFACT }}
          if-no-files-found: error

  publish-release:
    needs: build-server
    if: github.ref_name == 'rust'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ env.BINARY_ARTIFACT }}
          path: release

      - name: Write checksum
        run: |
          cd release
          sha256sum "${{ env.BINARY_ARTIFACT }}" > "${{ env.BINARY_ARTIFACT }}.sha256"

      - name: Publish rust-latest release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view rust-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create rust-latest \
              --repo "$GITHUB_REPOSITORY" \
              --title "ptlabel rust-latest" \
              --notes "Latest rust branch ARMv6 build for Pi Zero 1." \
              --prerelease
          gh release upload rust-latest \
            --repo "$GITHUB_REPOSITORY" \
            "release/${{ env.BINARY_ARTIFACT }}" \
            "release/${{ env.BINARY_ARTIFACT }}.sha256" \
            --clobber

  golden-render:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Python golden renders
        run: |
          python3 -m venv .venv-golden
          .venv-golden/bin/pip install -r tests/requirements-golden.txt
          .venv-golden/bin/python scripts/render-golden.py

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: JS golden renders
        run: |
          npm install
          node scripts/render-golden.mjs

      - name: Compare golden PNGs
        run: .venv-golden/bin/python scripts/compare-golden.py

  deploy-pi:
    needs: build-server
    runs-on: [self-hosted, pi]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: ${{ env.BINARY_ARTIFACT }}
          path: _artifact

      - name: Deploy to Pi
        run: ./scripts/pi-deploy.sh "_artifact/${{ env.BINARY_ARTIFACT }}"
