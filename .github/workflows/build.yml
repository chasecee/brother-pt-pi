name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  RELEASE_ASSET: ptlabel-server-linux-arm64

jobs:
  build-server:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Build arm64 binary
        run: |
          cargo build --release -p ptlabel-server
          cp target/release/ptlabel-server "target/release/${{ env.RELEASE_ASSET }}"

      - name: Publish Pi release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pi-${{ github.run_number }}
          name: Pi build ${{ github.run_number }}
          body: ${{ github.sha }}
          files: target/release/${{ env.RELEASE_ASSET }}
          make_latest: true

  golden-render:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python golden renders
        run: |
          python3 -m venv .venv-golden
          .venv-golden/bin/pip install -r tests/requirements-golden.txt
          .venv-golden/bin/python scripts/render-golden.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: JS golden renders
        run: |
          npm install
          node scripts/render-golden.mjs

      - name: Compare golden PNGs
        run: .venv-golden/bin/python scripts/compare-golden.py
