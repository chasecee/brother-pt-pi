name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  BINARY_NAME: ptlabel-server

jobs:
  build-server:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Build arm64 binary
        run: cargo build --release -p ptlabel-server

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ptlabel-server-linux-arm64
          path: target/release/ptlabel-server
          if-no-files-found: error

  golden-render:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python golden renders
        run: |
          python3 -m venv .venv-golden
          .venv-golden/bin/pip install -r tests/requirements-golden.txt
          .venv-golden/bin/python scripts/render-golden.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: JS golden renders
        run: |
          npm install
          node scripts/render-golden.mjs

      - name: Compare golden PNGs
        run: python3 scripts/compare-golden.py
