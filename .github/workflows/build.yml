name: build

on:
  push:
    branches: [main, rust]
  workflow_dispatch:

env:
  BINARY_ARTIFACT: ptlabel-server-linux-arm64

jobs:
  build-server:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Build arm64 binary
        run: |
          cargo build --release -p ptlabel-server
          cp target/release/ptlabel-server "target/release/${{ env.BINARY_ARTIFACT }}"

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BINARY_ARTIFACT }}
          path: target/release/${{ env.BINARY_ARTIFACT }}
          if-no-files-found: error

  golden-render:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Python golden renders
        run: |
          python3 -m venv .venv-golden
          .venv-golden/bin/pip install -r tests/requirements-golden.txt
          .venv-golden/bin/python scripts/render-golden.py

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: JS golden renders
        run: |
          npm install
          node scripts/render-golden.mjs

      - name: Compare golden PNGs
        run: .venv-golden/bin/python scripts/compare-golden.py

  deploy-pi:
    needs: build-server
    runs-on: [self-hosted, pi]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: ${{ env.BINARY_ARTIFACT }}
          path: _artifact

      - name: Deploy to Pi
        run: ./scripts/pi-deploy.sh "_artifact/${{ env.BINARY_ARTIFACT }}"
