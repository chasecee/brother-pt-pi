[package]
name = "chain-print"
version = "0.1.0"
edition = "2021"

[lib]
name = "chain_print"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
ptouch = { path = "vendor/ptouch", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
